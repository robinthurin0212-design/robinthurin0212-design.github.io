header{background:#253b37;color:#fff;padding:24px max(24px,calc((100vw - 1120px)/2));}header a{color:#fff;text-decoration:none;font-weight:700}main{max-width:1120px;margin:auto;padding:36px 22px 64px}h1{font:700 clamp(30px,5vw,48px)/1.08 Georgia,serif;margin:12px 0}h2{font:700 clamp(24px,3vw,32px)/1.15 Georgia,serif;margin:0 0 12px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#cc4a3c}header .eyebrow{color:#eeb5a9} .lead{max-width:760px;color:#556461}.card{margin:30px 0 0;background:#fff;border:1px solid #dbe2df;border-radius:16px;padding:clamp(16px,3vw,28px);box-shadow:0 10px 30px #203e3510}.card p{color:#50615d}.card img{display:block;width:100%;height:auto;border-radius:6px}.caption{font-size:14px;color:#536460}.source{font-size:13px;color:#687975}a:focus-visible{outline:3px solid #cf4438;outline-offset:4px}a.image-link{display:block}
</style></head><body><header><a href="./index.html">← Retour à la carte</a></header>
<main><h1>Statistiques des mobilités</h1>
<article class="card"><a class="image-link" href="./assets/statistiques-modes-travail.png"><img src="./assets/statistiques-modes-travail.png" alt="Comparaison des modes de transport pour aller au travail en 2023 à Latresne et en Gironde : voiture 83 % contre 70,2 %, transports en commun 3,6 % contre 12,6 %, marche 1,7 % contre 4,4 %, vélo 3,9 % contre 6,8 %, sans déplacement 5 % contre 4 %."></a></article>
<article class="card"><a class="image-link" href="./assets/statistiques-lieu-travail.png"><img src="./assets/statistiques-lieu-travail.png" alt="Lieu de travail des actifs occupés de 15 ans ou plus : 19,5 % dans leur commune de résidence et 80,5 % dans une autre commune."></a></article></main><script>
/* Recolorie uniquement le fond uni des visuels ; les textes, diagrammes,
   figurés et photographies restent issus des images d'origine. */
document.querySelectorAll('.image-link img').forEach((img, index) => {
  function recolor() {
    const canvas = document.createElement('canvas');
    canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
    const ctx=canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(img,0,0);
    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
    const original=index===0?[188,219,228]:[0,151,178];
    const target=index===0?[217,229,223]:[49,74,66];
    for(let y=0;y<canvas.height;y++) for(let x=0;x<canvas.width;x++) {
      const k=(y*canvas.width+x)*4, d=pixels.data;
      const sx=x*1117/canvas.width, sy=y*627/canvas.height;
      // Les deux disques contiennent des photos : aucun pixel n'y est modifié.
      if(index===1 && (((sx-287)/169)**2+((sy-323)/169)**2<1.03 ||
         ((sx-815)/214)**2+((sy-323)/214)**2<1.03)) continue;
      const dist=Math.max(Math.abs(d[k]-original[0]),Math.abs(d[k+1]-original[1]),Math.abs(d[k+2]-original[2]));
      if(dist<=3){d[k]=target[0];d[k+1]=target[1];d[k+2]=target[2];}
    }
    ctx.putImageData(pixels,0,0);
    canvas.setAttribute('role','img'); canvas.setAttribute('aria-label',img.alt);
    canvas.style.cssText='display:block;width:100%;height:auto;border-radius:6px';
    img.replaceWith(canvas);
    canvas.parentElement.href=canvas.toDataURL('image/png');
  }
  if(img.complete && img.naturalWidth) recolor();
  else img.addEventListener('load',recolor,{once:true});
});
</script></body></html>
